plugins { id 'com.android.application' }

android { namespace 'jp.haruto.dreamcamera'; compileSdk 36
    // CI では Secret から復元した鍵を使う（スマホに上書きできる同じ鍵）。ローカルは通常のデバッグ鍵
    signingConfigs { debug { def ks = System.getenv('DC_DEBUG_KEYSTORE'); if (ks) { storeFile file(ks); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
    defaultConfig { applicationId 'jp.haruto.dreamcamera'; minSdk 31; targetSdk 36; versionCode 7; versionName '0.5.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-extensions:1.4.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
